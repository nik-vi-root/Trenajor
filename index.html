<!-- ЕДИНСТВЕННАЯ панель управления -->
  <div class="control-panel">
    <input type="text" id="newTaskInput" placeholder="Добавь фразу или код...">

    <button id="addBtn" class="action-btn" title="Добавить">+</button>
    <button id="removeBtn" class="action-btn" title="Удалить">-</button>
    <button id="saveBtn" class="action-btn" title="Сохранить">💾</button>
    <button id="themeBtn" class="action-btn" style="width: 40px;" title="Сменить тему">🎨</button>
  </div>

  <!-- Панель для кнопок-заданий -->
  <div class="btn-panel" id="btnPanel"></div>

  <!-- Блок с заданием -->
  <div id="target"></div>
  
  <!-- Поле ввода -->
  <input type="text" id="mainInput" class="main-input" placeholder="Печатай код..." autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false">
  
  <!-- ОПИСАНИЕ (под полем ввода) -->
  <div id="descriptionBox"></div>

  <!-- Статус -->
  <div id="status">Успешно: 0/10</div>

<script src="./script/script.js"></script>
</body>
